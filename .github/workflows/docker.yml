name: Auto Docker Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Build Docker image
        run: docker build -t sky-website .
        
      - name: Docker build success
        run: echo "Docker image build ayyindi mawa 🔥"